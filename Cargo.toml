[package]
name = "no-sleep-rs"
description = "A simple Rust application to prevent the computer from sleeping."
version = "0.1.0"
edition = "2024"

[dependencies]
enigo = { version = "0.6.1" }
crossterm = "0.29.0"
rand = { version = "0.9.2", features = ["std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
ctrlc = "3.2"
